<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1a16">
<link rel="manifest" href="manifest.json">
<title>ScoreCasting</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: één scherm op Hub-formaat (1024x600): balk met "Live", "Alles" en de competities bovenin, daaronder een raster van twee kolommen met wedstrijden. */
:root{
  color-scheme:dark;
  --veld:#0d1a16;      /* achtergrond, donker grasgroen */
  --vlak:#16271f;      /* wedstrijdregel */
  --lijn:#274236;
  --tekst:#f1f5ee;
  --zacht:#9fb3a6;
  --live:#ffd23f;      /* lichtkrant-geel voor live en doelpunten */
  --font:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--veld);color:var(--tekst);font-family:var(--font);display:flex;flex-direction:column;padding:10px 16px 12px;gap:8px;overflow:hidden}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 12px}
.rij{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:600 17px var(--font);letter-spacing:.03em;text-transform:uppercase;color:var(--zacht);background:none;border:2px solid var(--lijn);border-radius:6px;padding:2px 8px;cursor:pointer}
.tab.per{font-size:16px;border-radius:999px;padding:2px 12px}
.tab[aria-pressed="true"]{color:var(--veld);background:var(--tekst);border-color:var(--tekst)}
.kies{font-family:var(--font);max-width:11.5em;text-overflow:ellipsis;appearance:auto;cursor:pointer}
.kies.aan{color:var(--veld);background:var(--tekst);border-color:var(--tekst)}
.kies option,.kies optgroup{color:#111;background:#fff;text-transform:none}
#zoek{width:100%;max-width:900px;margin:0 auto;box-sizing:border-box;font:600 20px var(--font);padding:8px 12px;border-radius:6px;border:1px solid var(--zacht);background:var(--vlak);color:var(--tekst)}
#zoek[hidden]{display:none}
#zoek:focus-visible{outline:3px solid var(--live)}
.club span.fav{color:var(--live)}
main.compact .duel.na .club small{display:-webkit-box;-webkit-line-clamp:1;font-size:14px}
main.compact .duel.na{min-height:52px}
.hub .zoektab{display:none}
main.standtabel{display:block;overflow-y:auto}
.standrij{width:100%;box-sizing:border-box}
.standrij{display:grid;grid-template-columns:30px 28px minmax(0,1fr) 40px 36px 36px 36px 52px 46px;align-items:center;column-gap:8px;padding:3px 12px;min-height:29px;font-size:clamp(17px,2.4vw,23px);font-weight:600;border-radius:4px}
.standrij:nth-child(even){background:var(--vlak)}
.standrij.kop{font-size:14px;color:var(--zacht);text-transform:uppercase;letter-spacing:.05em;background:none;min-height:22px;margin:0}
.standrij span{text-align:right;font-variant-numeric:tabular-nums}
.standrij span.naam{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.standrij img,.standrij>span:nth-child(2){width:24px;height:24px;object-fit:contain}
.standrij .pts{font-weight:700}
@media (max-width:640px){.standrij{grid-template-columns:22px 22px minmax(0,1fr) 28px 40px 34px;column-gap:6px;font-size:17px;min-height:34px}.standrij img,.standrij>span:nth-child(2){width:20px;height:20px}.standrij .wgv{display:none}}
.breek{display:none}
.pijl{font-size:22px;line-height:1;padding:1px 10px 4px}
.leeg{padding:30px 0}
#versie{position:fixed;right:8px;bottom:5px;font-size:11px;color:var(--zacht);opacity:.6;pointer-events:none}
.tab .n{color:var(--live);margin-left:6px}
.tab[aria-pressed="true"] .n{color:#8a5a00}
.tab:focus-visible,.wissel:focus-visible{outline:3px solid var(--live);outline-offset:2px}
.wissel{justify-self:end;font:600 16px var(--font);color:var(--zacht);background:none;border:0;cursor:pointer;text-transform:uppercase;letter-spacing:.03em}
.wissel[aria-pressed="true"]{color:var(--live)}
.hoek{justify-self:end;display:flex;align-items:center;gap:12px}
#castknop{background:none;border:0;padding:4px;display:flex;cursor:pointer;color:var(--tekst);border-radius:6px}
#castknop.aan{color:var(--live)}
#castknop:focus-visible{outline:3px solid var(--live)}
#klok{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.titel{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.titel h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.titel .n{color:var(--live);margin-left:10px;font-size:20px}
.standnoot{font-size:14px;color:var(--live);margin-bottom:2px}
main{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;display:grid;grid-template-columns:minmax(0,1fr);width:100%;max-width:900px;margin:0 auto;grid-auto-rows:max-content;align-content:start;gap:8px}
main::-webkit-scrollbar{display:none}
.kop{grid-column:1/-1;margin:4px 0 0;font-size:17px;font-weight:600;color:var(--zacht);text-transform:uppercase;letter-spacing:.06em}
.kop:first-child{margin-top:0}
.duel{background:var(--vlak);border-radius:6px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;padding:8px 14px;position:relative;min-height:84px}
.duel.live::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:4px;background:var(--live);border-radius:2px}
.duel.goal{animation:goal 1s ease-in-out 8}
@keyframes goal{50%{background:var(--live);color:var(--veld)}}
.duel.goal .min,.duel.goal .makers,.duel.goal .club{color:inherit}
.club{display:flex;align-items:center;gap:8px;min-width:0;font-size:clamp(18px,2.6vw,28px);font-weight:600}
.club.uit{flex-direction:row-reverse;text-align:right}
.club img{width:clamp(24px,3.4vw,38px);height:clamp(24px,3.4vw,38px);object-fit:contain;flex:none}
.naam{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.club span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.club small{font-size:16px;font-weight:500;color:var(--zacht);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;white-space:normal}
.club.verliezer{color:var(--zacht);font-weight:500}
.midden{text-align:center;min-width:92px}
.stand{font-size:clamp(28px,4.4vw,46px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.status{font-size:17px;color:var(--zacht);font-weight:600;letter-spacing:.03em}
.duel.live .status{color:var(--live)}
.duel.voor .stand{font-size:clamp(22px,3.2vw,34px);color:var(--zacht)}
main.compact{gap:5px 8px}
main.compact .duel{padding:5px 12px;min-height:48px;max-height:none}
main.compact .club{font-size:24px}
main.compact .club img{width:24px;height:24px}
main.compact .midden{display:flex;align-items:baseline;justify-content:center;gap:8px}
main.compact .stand,main.compact .duel.voor .stand{font-size:25px}
main.compact .status{font-size:15px}
main.compact .club small{display:none}
main.compact .duel.live{min-height:52px}
main.compact .duel.live .club small{display:-webkit-box;-webkit-line-clamp:1;font-size:14px}
.leeg{grid-column:1/-1;align-self:center;text-align:center;font-size:28px;color:var(--zacht)}
#flits{position:fixed;left:16px;right:16px;bottom:12px;background:var(--live);color:var(--veld);font-size:30px;font-weight:700;padding:8px 16px;border-radius:6px;text-align:center}
[hidden]{display:none!important}
.hub header,.hub .subbar{display:none}
.hub .titel{display:flex}
@media (max-width:640px){main{grid-template-columns:1fr}body{overflow:auto;padding:8px 16px}.duel{min-height:64px}.rij{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.rij::-webkit-scrollbar{display:none}.tab,.tab.per{font-size:16px;white-space:nowrap;flex:none}#klok{display:none}#tabs{flex-wrap:wrap;overflow:visible;row-gap:6px}.zoektab{order:1}.breek{display:block;order:2;flex-basis:100%;height:0}#tabs .pijl,#tabs .kies{order:3}#tabs .kies{flex:1;max-width:none}main.compact .midden{flex-direction:column;align-items:center;gap:0}main.compact .club{font-size:18px}main.compact .stand,main.compact .duel.voor .stand{font-size:21px}main.compact .status{font-size:12px}header{display:flex;flex-wrap:wrap}#tabs{flex:1 1 calc(100% - 60px);min-width:0}#periodes{flex:1 1 calc(100% - 160px);min-width:0}.kies{max-width:13em}.club small{-webkit-line-clamp:4;font-size:14px}.makers{font-size:12.5px;padding-bottom:4px}.makers.thuis{text-align:left;padding-left:2px}.standrij{grid-template-columns:22px 22px minmax(0,1fr) 28px 40px 34px;column-gap:6px;font-size:17px;min-height:34px}.standrij img,.standrij>span:nth-child(2){width:22px;height:22px}.standrij .wgv{display:none}.kop{font-size:13px}.tab{font-size:14px;padding:3px 8px}main.compact .duel{min-height:36px}.titel h1{font-size:20px}.titel .n{font-size:16px}}
@media (prefers-reduced-motion:reduce){.duel.goal{animation:none;outline:3px solid var(--live)}}
</style>
</head>
<body>
<header>
  <div id="tabs" class="rij"></div>
  <div class="hoek"><button id="castknop" aria-label="Casten naar je Hub" title="Casten naar je Hub"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M1 18v3h3a3 3 0 0 0-3-3zm0-4v2a5 5 0 0 1 5 5h2a7 7 0 0 0-7-7zm0-4v2a9 9 0 0 1 9 9h2A11 11 0 0 0 1 10zm20-7H3a2 2 0 0 0-2 2v3h2V5h18v14h-7v2h7a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg></button><span id="klok"></span></div>
  <div id="periodes" class="rij"></div>
  <button class="wissel" id="wissel" aria-pressed="true" title="Automatisch wisselen tussen competities">Wisselen aan</button>
</header>
<div id="titel" class="titel" hidden><h1 id="titelnaam"></h1><span class="klok" id="klok2"></span></div>
<input id="zoek" type="search" placeholder="Zoek een club" aria-label="Zoek een club" autocomplete="off" hidden>
<div id="versie"></div>
<main id="lijst"><p class="leeg">Standen laden…</p></main>
<div id="flits" hidden></div>
<script>
// ---- Instellingen: pas hier aan wat je wilt ----
const COMPETITIES = [
  {code:"ned.1", naam:"Eredivisie"},
  {code:"ned.2", naam:"KKD"},
  {code:"eng.1", naam:"Engeland"},
  {code:"esp.1", naam:"Spanje"},
  {code:"ger.1", naam:"Duitsland"},
  {code:"ita.1", naam:"Italië"},
  {code:"fra.1", naam:"Frankrijk"},
  {code:"bel.1", naam:"België"},
  {code:"uefa.champions", naam:"Champions"},
  {code:"uefa.europa", naam:"Europa"},
  {code:"uefa.europa.conf", naam:"Conference"},
  {code:"uefa.nations", naam:"Nations League"},
  {code:"fifa.worldq.uefa", naam:"WK-kwalificatie"},
  {code:"uefa.euroq", naam:"EK-kwalificatie"},
  {code:"fifa.world", naam:"WK"},
  {code:"uefa.euro", naam:"EK"},
];
const codesVan = c => c.codes || [c.code];
const compVan = code => COMPETITIES.find(c => c.code === code);
const BRONNEN = COMPETITIES.flatMap(c => codesVan(c).map(code => ({code, comp: c})));
const KEUZEGROEPEN = [["Nederland",["ned.1","ned.2"]],["Buitenland",["eng.1","esp.1","ger.1","ita.1","fra.1","bel.1"]],["Europa",["uefa.champions","uefa.europa","uefa.europa.conf"]],["Interlands",["uefa.nations","fifa.worldq.uefa","uefa.euroq","fifa.world","uefa.euro"]]];
const VERSIE = "v24";
const LIVE = -1;          // het tabblad "Live": alle competities door elkaar
const FAV = -3;           // het tabblad met je favoriete clubs
const ZOEK = -4;          // zoeken op clubnaam (alleen op telefoon of laptop)
const SPECIAAL = {[-1]:"live", [-2]:"alles", [-3]:"fav", [-4]:"zoek"};
const ALLES = -2;         // het tabblad "Alles": alle wedstrijden van vandaag
const PERIODES = [
  {id:"maand", naam:"Afgelopen maand"},
  {id:"vorige", naam:"Afgelopen week"},
  {id:"vandaag", naam:"Vandaag"},
  {id:"komende", naam:"Komende week"},
  {id:"stand", naam:"Stand"},
];
const VERVERS_SEC = 30;    // hoe vaak de standen van vandaag worden opgehaald
const WEEK_MIN    = 15;    // hoe vaak het weekoverzicht wordt ververst
const STAND_SEC   = 60;    // hoe vaak de ranglijst wordt opgehaald
const WISSEL_SEC  = 20;    // hoe lang elke competitie in beeld blijft
// -------------------------------------------------

const dagen = {};         // code -> {jjjjmmdd: [duels]}
const kalender = {};      // code -> [jjjjmmdd] binnen een week rond vandaag
const fout = {};          // code -> true als ophalen niet lukt
const standen = {};       // code -> {rijen, ts, mislukt} officiële ranglijst
const vorige = {};        // wedstrijd-id -> "thuis-uit"
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("favclubs") || "[]").map(String)); } catch (e) {}
const isFav = d => favs.has(d.thuis.id) || favs.has(d.uit.id);
function wisselFav(id){
  favs.has(id) ? favs.delete(id) : favs.add(id);
  onthoud("favclubs", JSON.stringify([...favs]));
  teken(); window.stuurKeuze?.();
}
let actief = LIVE, periode = "vandaag", wisselen = true, eersteKeer = true, flitsTimer;

const $ = id => document.getElementById(id);
const ymd = d => d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0");
const plus = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const onthoud = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lees = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

function verwerk(ev){
  const c = ev.competitions[0], t = c.status.type;
  const thuis = c.competitors.find(x => x.homeAway === "home"), uit = c.competitors.find(x => x.homeAway === "away");
  const start = new Date(ev.date);
  let status, soort;
  if (t.state === "in"){ soort = "live"; status = t.name === "STATUS_HALFTIME" ? "RUST" : c.status.displayClock; }
  else if (t.state === "post"){ soort = "na"; status = t.completed ? "Afgelopen" : t.description; }
  else { soort = "voor"; status = t.name === "STATUS_SCHEDULED" ? "" : t.description; }
  // Doelpuntenmakers per club, bijvoorbeeld "Til 23', 67' (p)".
  const makers = x => {
    const per = new Map();
    for (const g of c.details || []){
      if (!g.scoringPlay || String(g.team?.id) !== String(x.team.id)) continue;
      const a = g.athletesInvolved?.[0];
      const naam = a?.shortName || a?.displayName || "Doelpunt";
      const min = (g.clock?.displayValue || "") + (g.penaltyKick ? " (p)" : "") + (g.ownGoal ? " (e.d.)" : "");
      per.set(naam, [...(per.get(naam) || []), min]);
    }
    return [...per].map(([n, m]) => (n + " " + m.join(", ")).trim()).join(" · ");
  };
  const club = x => ({id: String(x.team.id), naam: x.team.shortDisplayName || x.team.displayName, logo: x.team.logo, score: x.score, makers: makers(x)});
  return {id: ev.id, start, dag: ymd(start), soort, status, thuis: club(thuis), uit: club(uit)};
}

async function haalDag(code, dag){
  const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${code}/scoreboard?dates=${dag}`, {cache:"no-store", signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined});
  if (!r.ok) throw new Error(r.status);
  const j = await r.json();
  (dagen[code] ||= {})[dag] = (j.events || []).map(verwerk);
  return j;
}

// De officiële ranglijst van een competitie ophalen (hooguit één keer per minuut).
async function haalStand(code){
  const oud = standen[code];
  if (oud && Date.now() - oud.ts < STAND_SEC * 1000) return;
  try {
    const r = await fetch(`https://site.api.espn.com/apis/v2/sports/soccer/${code}/standings`, {cache:"no-store", signal: AbortSignal.timeout ? AbortSignal.timeout(10000) : undefined});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const groepen = (j.children || []).filter(c => c.standings?.entries?.length);
    if (!groepen.length) groepen.push(j);
    const stat = (e, n) => { const x = (e.stats || []).find(q => q.name === n); return x ? x.value ?? Number(x.displayValue) : 0; };
    const rijen = groepen.flatMap(groep => (groep.standings?.entries || []).map(e => ({
      groep: groepen.length > 1 ? (groep.name || groep.abbreviation || "") : "",
      id: String(e.team.id), naam: e.team.shortDisplayName || e.team.displayName, logo: e.team.logos?.[0]?.href || "",
      rank: stat(e, "rank"), gp: stat(e, "gamesPlayed"), w: stat(e, "wins"), d: stat(e, "ties"), l: stat(e, "losses"),
      gd: stat(e, "pointDifferential"), gf: stat(e, "pointsFor"), ga: stat(e, "pointsAgainst"), pts: stat(e, "points"),
      note: e.note?.description || "", noteKleur: e.note?.color || ""
    })));
    standen[code] = {rijen, ts: Date.now()};
  } catch (e) { standen[code] = {rijen: standen[code]?.rijen || [], ts: Date.now() - (STAND_SEC - 15) * 1000, mislukt: true}; }
}
// Stand en oudere uitslagen worden pas opgehaald als je ze kiest.
const bezig = {};
function laadStand(code){
  const s = standen[code];
  if ((s && Date.now() - s.ts < STAND_SEC * 1000) || bezig["s" + code]) return;
  bezig["s" + code] = true;
  haalStand(code).finally(() => { bezig["s" + code] = false; teken(); });
}
const kalVol = {}, oudKlaar = {};
function laadMaand(code){
  if (oudKlaar[code] || bezig["m" + code] || !(code in kalVol)) return;
  bezig["m" + code] = true;
  const van = plus(-30), tot = plus(-8);
  const dgn = kalVol[code] ? kalVol[code].filter(d => d >= van && d <= tot) : Array.from({length: 23}, (_, i) => plus(-8 - i));
  Promise.all(dgn.filter(d => !dagen[code]?.[d]).map(d => haalDag(code, d).catch(() => {})))
    .finally(() => { bezig["m" + code] = false; oudKlaar[code] = true; teken(); });
}

// Vandaag: elke 30 seconden. Geeft ook de speelkalender van de competitie terug.
async function haalVandaag(b, goals){
  try {
    const j = await haalDag(b.code, plus(0));
    fout[b.code] = false;
    const van = plus(-7), tot = plus(7);
    const cal = j.leagues?.[0]?.calendar || [];
    // Toernooien geven geen losse speeldagen terug: haal dan gewoon elke dag van de twee weken op.
    kalVol[b.code] = cal.length && typeof cal[0] === "string" ? [...new Set(cal.map(x => x.slice(0,10).replace(/-/g,"")))] : null;
    kalender[b.code] = cal.length && typeof cal[0] === "string"
      ? [...new Set(cal.map(x => x.slice(0,10).replace(/-/g,"")))].filter(d => d >= van && d <= tot && d !== plus(0))
      : [-7,-6,-5,-4,-3,-2,-1,1,2,3,4,5,6,7].map(plus);
    for (const d of dagen[b.code][plus(0)]){
      const s = d.thuis.score + "-" + d.uit.score;
      if (!eersteKeer && d.soort === "live" && vorige[d.id] !== undefined && vorige[d.id] !== s){ d.goal = true; goals.push({comp: b.comp, d}); }
      vorige[d.id] = s;
    }
  } catch (e) { if (!dagen[b.code]) fout[b.code] = true; }
}

// De andere speeldagen van afgelopen en komende week: af en toe.
async function haalWeek(){
  for (const b of BRONNEN){
    await Promise.all((kalender[b.code] || []).map(d => haalDag(b.code, d).catch(() => {})));
    teken();
  }
}

async function ververs(){
  const goals = [];
  await Promise.all(BRONNEN.map(b => haalVandaag(b, goals)));
  if (goals.length){
    if (actief >= 0){ actief = COMPETITIES.indexOf(goals[0].comp); periode = "vandaag"; }
    toonFlits(goals.map(x => `GOAL  ${x.d.thuis.naam} ${x.d.thuis.score} - ${x.d.uit.score} ${x.d.uit.naam}`).join("   •   "));
  }
  if (eersteKeer){
    eersteKeer = false;
    teken();
    await haalWeek();
    // Wordt er vandaag nergens gespeeld, begin dan met het programma van komende week.
    if (!lees("periode") && !BRONNEN.some(b => duelsVan(b.code, "vandaag").length)) periode = "komende";
    if (periode === "stand" && actief >= 0) await haalStand(COMPETITIES[actief].code);
  }
  teken();
}

function toonFlits(tekst){
  $("flits").textContent = tekst; $("flits").hidden = false;
  clearTimeout(flitsTimer); flitsTimer = setTimeout(() => $("flits").hidden = true, 12000);
}

function duelsVan(code, per){
  const nu = plus(0), alle = Object.values(dagen[code] || {}).flat();
  const uniek = [...new Map(alle.map(d => [d.id, d])).values()];
  return uniek.filter(d => per === "vandaag" ? d.dag === nu : per === "maand" ? d.dag < nu && d.dag >= plus(-30) : per === "vorige" ? d.dag < nu && d.dag >= plus(-7) : d.dag > nu && d.dag <= plus(7))
              .sort((a,b) => per === "maand" || per === "vorige" ? b.start - a.start : a.start - b.start);
}
const groepVan = code => code === "live" ? "live" : code === "alles" ? "alles" : (COMPETITIES.find(c => c.code === code)?.groep || "nl");
const dagLabel = d => d.start.toLocaleDateString("nl-NL", {weekday:"long", day:"numeric", month:"long"});
const aantalLive = code => duelsVan(code, "vandaag").filter(d => d.soort === "live").length;

function knop(tekst, aan, klik, klasse){
  const b = document.createElement("button");
  b.className = klasse; b.setAttribute("aria-pressed", aan); b.onclick = klik;
  b.append(tekst);
  return b;
}
function tabKnop(naam, i, n){
  const b = knop(naam, i === actief, () => { actief = i; if (i !== ZOEK) onthoud("competitie", SPECIAAL[i] || COMPETITIES[i].code); if (i < 0) periode = "vandaag"; teken(); if (i === ZOEK) $("zoek").focus(); window.stuurKeuze?.(); }, "tab");
  if (n){ const sp = document.createElement("span"); sp.className = "n"; sp.textContent = "● " + n; b.append(sp); }
  return b;
}

function regel(d, metStatus, doel, label){
  const el = document.createElement("div");
  el.className = "duel " + d.soort + (d.goal ? " goal" : "");
  const club = (c, kant, verl) => {
    const w = document.createElement("div"); w.className = "club " + kant + (verl ? " verliezer" : "");
    if (c.logo){ const im = document.createElement("img"); im.src = c.logo; im.alt = ""; w.append(im); }
    const t = document.createElement("div"); t.className = "naam";
    const sn = document.createElement("span"); sn.textContent = (favs.has(c.id) ? "★ " : "") + c.naam; t.append(sn);
    if (favs.has(c.id)) sn.className = "fav";
    if (!document.body.classList.contains("hub")){ sn.style.cursor = "pointer"; sn.title = "Tik om als favoriet te volgen"; sn.onclick = () => wisselFav(c.id); }
    if (c.makers && d.soort !== "voor"){ const k = document.createElement("small"); k.textContent = c.makers; t.append(k); }
    w.append(t); return w;
  };
  const m = document.createElement("div"); m.className = "midden";
  const st = document.createElement("div"); st.className = "stand";
  st.textContent = d.soort === "voor" ? d.start.toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"}) : `${d.thuis.score} - ${d.uit.score}`;
  m.append(st);
  const stTekst = d.status && (metStatus || d.soort !== "na") ? d.status : (label || "");
  if (stTekst){ const x = document.createElement("div"); x.className = "status"; x.textContent = stTekst; m.append(x); }
  const tw = d.soort === "na" ? Number(d.thuis.score) > Number(d.uit.score) : null;
  const uw = d.soort === "na" ? Number(d.uit.score) > Number(d.thuis.score) : null;
  el.append(club(d.thuis, "thuis", uw), m, club(d.uit, "uit", tw));
  doel.append(el);
  d.goal = false;
}

function teken(){
  const tabs = $("tabs");
  // Niet opnieuw opbouwen terwijl de keuzelijst openstaat.
  if (document.activeElement?.id !== "kies"){
    tabs.textContent = "";
    const totaal = COMPETITIES.reduce((n, c) => n + aantalLive(c.code), 0);
    tabs.append(tabKnop("Live", LIVE, totaal));
    tabs.append(tabKnop("Alles", ALLES, 0));
    const fk = tabKnop("★", FAV, 0); fk.setAttribute("aria-label", "Favorieten"); fk.title = "Favorieten"; tabs.append(fk);
    const kies = document.createElement("select");
    kies.id = "kies"; kies.className = "tab kies" + (actief >= 0 ? " aan" : ""); kies.setAttribute("aria-label", "Competitie kiezen");
    const o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Competitie"; o0.hidden = true; kies.append(o0);
    for (const [gnaam, codes] of KEUZEGROEPEN){
      const og = document.createElement("optgroup"); og.label = gnaam;
      for (const code of codes){
        const i = COMPETITIES.findIndex(c => c.code === code); if (i < 0) continue;
        const o = document.createElement("option"); o.value = i; const n = aantalLive(code);
        o.textContent = COMPETITIES[i].naam + (n ? "  ● " + n : ""); og.append(o);
      }
      kies.append(og);
    }
    kies.value = actief >= 0 ? String(actief) : "";
    kies.onchange = () => { if (kies.value === "") return; actief = Number(kies.value); onthoud("competitie", COMPETITIES[actief].code); kies.blur(); teken(); window.stuurKeuze?.(); };
    const stap = n => () => { actief = actief < 0 ? (n > 0 ? 0 : COMPETITIES.length - 1) : (actief + n + COMPETITIES.length) % COMPETITIES.length; onthoud("competitie", COMPETITIES[actief].code); $("lijst").scrollTop = 0; teken(); window.stuurKeuze?.(); };
    const pijl = (t, n, lab) => { const b = knop(t, false, stap(n), "tab pijl"); b.setAttribute("aria-label", lab); b.title = lab; b.removeAttribute("aria-pressed"); return b; };
    const breek = document.createElement("span"); breek.className = "breek";
    tabs.append(breek, pijl("‹", -1, "Vorige competitie"), kies, pijl("›", 1, "Volgende competitie"));
    const zk = tabKnop("Zoek", ZOEK, 0); zk.classList.add("zoektab"); tabs.append(zk);
  }
  const per = $("periodes"); per.textContent = "";
  PERIODES.forEach(p => per.append(knop(p.naam, p.id === periode, () => { periode = p.id; onthoud("periode", p.id); teken(); window.stuurKeuze?.(); }, "tab per")));

  const lijst = $("lijst");
  lijst.textContent = "";
  per.hidden = actief < 0;
  $("zoek").hidden = actief !== ZOEK;
  const cast = document.body.classList.contains("hub");
  const titelTekst = actief === FAV ? "Favorieten" : actief === ZOEK ? "Zoeken" : actief === LIVE ? "Live" : actief === ALLES ? "Alles vandaag" : COMPETITIES[actief].naam + (periode === "stand" ? " · Stand" : periode === "vandaag" ? "" : " · " + PERIODES.find(p => p.id === periode).naam);
  $("titel").hidden = !cast && actief >= 0 && periode !== "stand" ? true : false;
  $("titel").hidden = !cast;
  if (cast){
    $("titelnaam").textContent = titelTekst;
    $("klok2").textContent = $("klok").textContent;
  }
  const leeg = t => { const p = document.createElement("p"); p.className = "leeg"; p.textContent = t; lijst.append(p); };
  const kop = t => { const h = document.createElement("h2"); h.className = "kop"; h.textContent = t; lijst.append(h); };

  if (actief === FAV || actief === ZOEK){
    const q = $("zoek").value.trim().toLowerCase();
    if (actief === ZOEK && q.length < 2){ lijst.className = ""; leeg("Typ een clubnaam, bijvoorbeeld Ajax."); return; }
    const past = d => actief === FAV ? isFav(d) : (d.thuis.naam + " " + d.uit.naam).toLowerCase().includes(q);
    const nu = plus(0);
    const alle = COMPETITIES.flatMap(c => ["vorige","vandaag","komende"].flatMap(p => duelsVan(c.code, p)).filter(past).map(d => ({d, c})));
    const rang = x => x.d.dag === nu ? 0 : x.d.dag > nu ? 1 : 2;
    alle.sort((a,b) => rang(a) - rang(b) || (rang(a) === 2 ? b.d.start - a.d.start : a.d.start - b.d.start));
    lijst.className = alle.length > 5 ? "compact" : "";
    if (!alle.length){
      leeg(actief === ZOEK ? "Geen wedstrijden gevonden in deze twee weken."
        : !favs.size ? "Nog geen favorieten. Tik bij een wedstrijd op een clubnaam om die club te volgen."
        : BRONNEN.some(b => !dagen[b.code] && !fout[b.code]) ? "Standen laden…" : "Je favorieten spelen niet in deze twee weken.");
      return;
    }
    let dag = "";
    for (const x of alle){
      if (x.d.dag !== dag){ dag = x.d.dag; kop(dag === nu ? "Vandaag" : dagLabel(x.d)); }
      regel(x.d, true, lijst, x.c.naam);
    }
    return;
  }

  if (actief === LIVE || actief === ALLES){
    const perComp = COMPETITIES.map(c => ({c, duels: duelsVan(c.code, "vandaag")}));
    const isLive = perComp.some(x => x.duels.some(d => d.soort === "live"));
    const groepen = perComp.map(x => ({c: x.c, duels: (actief === LIVE && isLive) ? x.duels.filter(d => d.soort === "live") : x.duels})).filter(x => x.duels.length);
    const n = groepen.reduce((t, x) => t + x.duels.length, 0);
    lijst.className = n > 6 ? "compact" : "";
    if (!n){ leeg(BRONNEN.some(b => !dagen[b.code] && !fout[b.code]) ? "Standen laden…" : actief === LIVE ? "Vandaag wordt er nergens gespeeld. Kies een competitie voor het programma." : "Vandaag geen wedstrijden."); return; }
    if (actief === LIVE && !isLive){ const sn = document.createElement("div"); sn.className = "standnoot"; sn.textContent = "● Er wordt nu niet gespeeld. Alle wedstrijden van vandaag:"; lijst.append(sn); }
    else if (actief === LIVE && cast){ const sn = document.createElement("div"); sn.className = "standnoot"; sn.textContent = "● Live stand, bijgewerkt met lopende wedstrijden"; lijst.append(sn); }
    for (const g of groepen){ kop(g.c.naam); [...g.duels].sort((a,b) => isFav(b) - isFav(a)).forEach(d => regel(d, true, lijst)); }
    return;
  }

  const comp = COMPETITIES[actief], code = comp.code;
  if (periode === "stand"){ laadStand(code); tekenStand(code); return; }
  if (periode === "maand") laadMaand(code);
  const duels = duelsVan(code, periode);
  lijst.className = duels.length > 10 || periode !== "vandaag" ? "compact" : "";
  if (!duels.length){
    leeg(codesVan(COMPETITIES[actief]).some(k => !dagen[k] && !fout[k]) ? "Standen laden…"
      : fout[code] && !dagen[code] ? "Standen ophalen lukt niet. Controleer de internetverbinding; er wordt opnieuw geprobeerd."
      : periode === "vandaag" ? "Vandaag geen wedstrijden in deze competitie."
      : periode === "maand" ? (oudKlaar[code] ? "Geen wedstrijden in de afgelopen maand." : "Uitslagen laden…")
      : periode === "vorige" ? "Geen wedstrijden in de afgelopen week." : "Geen wedstrijden in de komende week.");
    return;
  }
  if (periode === "vandaag" && cast){ const live = duels.some(d => d.soort === "live"); if (live){ const sn = document.createElement("div"); sn.className = "standnoot"; sn.textContent = "● Live stand, bijgewerkt met lopende wedstrijden"; lijst.append(sn); } }
  let dag = "";
  for (const d of duels){
    if (periode !== "vandaag" && d.dag !== dag){ dag = d.dag; kop(dagLabel(d)); }
    regel(d, periode === "vandaag", lijst);
  }
}

function tekenStand(code){
  const lijst = $("lijst"), s = standen[code];
  const cast = document.body.classList.contains("hub");
  const leeg = t => { const p = document.createElement("p"); p.className = "leeg"; p.textContent = t; lijst.append(p); };
  lijst.className = "standtabel";
  if (!s || !s.rijen.length){ leeg(s?.mislukt ? "Stand ophalen lukt niet. Er wordt opnieuw geprobeerd." : "Stand laden…"); return; }
  const kop = document.createElement("div"); kop.className = "standrij kop";
  ["#", "", "Club", "GS", "W", "G", "V", "DS", "Pt"].forEach((t,i) => { const c = document.createElement("span"); c.textContent = t; if (i >= 4 && i <= 6) c.className = "wgv"; if (i === 2) c.className = "naam"; kop.append(c); });
  lijst.append(kop);
  let groep = "";
  for (const r of s.rijen){
    if (r.groep && r.groep !== groep){ groep = r.groep; const h = document.createElement("h2"); h.className = "kop"; h.style.margin = "10px 12px 2px"; h.textContent = groep; lijst.append(h); }
    const el = document.createElement("div"); el.className = "standrij" + (r.live ? " live" : "");
    const im = r.logo ? document.createElement("img") : document.createElement("span");
    if (r.logo){ im.src = r.logo; im.alt = ""; }
    const cel = (t, k) => { const c = document.createElement("span"); c.textContent = t; if (k) c.className = k; return c; };
    el.append(cel(r.rank), im, cel(r.naam, "naam"), cel(r.gp), cel(r.w, "wgv"), cel(r.d, "wgv"), cel(r.l, "wgv"), cel((r.gd > 0 ? "+" : "") + r.gd), cel(r.pts, "pts"));
    lijst.append(el);
  }
}

function volgende(){
  if (!wisselen || actief < 0 || !$("flits").hidden) return;
  // Wissel tussen competities waar nu gespeeld wordt; anders tussen competities met wedstrijden in de gekozen periode.
  const idx = COMPETITIES.map((c,i) => i);
  let kandidaten = periode === "vandaag" ? idx.filter(i => aantalLive(COMPETITIES[i].code)) : [];
  if (!kandidaten.length) kandidaten = idx.filter(i => duelsVan(COMPETITIES[i].code, periode).length);
  if (!kandidaten.length) return;
  actief = kandidaten.find(i => i > actief) ?? kandidaten[0];
  teken();
}

$("wissel").onclick = () => {
  wisselen = !wisselen; onthoud("wisselen", wisselen ? "1" : "0");
  $("wissel").setAttribute("aria-pressed", wisselen);
  $("wissel").textContent = wisselen ? "Wisselen aan" : "Wisselen uit";
  window.stuurKeuze?.();
};
// De keuze van je telefoon overnemen op de Hub (wordt aangeroepen als er een bericht van de telefoon binnenkomt).
function neemKeuzeOver(k){
  if (!k) return;
  if (k.competitie === "live") actief = LIVE;
  else if (k.competitie === "alles") actief = ALLES;
  else if (k.competitie === "fav") actief = FAV;
  if (Array.isArray(k.favs)){ favs = new Set(k.favs.map(String)); onthoud("favclubs", JSON.stringify([...favs])); }
  else if (COMPETITIES.some(c => c.code === k.competitie)) actief = COMPETITIES.findIndex(c => c.code === k.competitie);
  if (PERIODES.some(p => p.id === k.periode)) periode = k.periode;
  if (typeof k.wisselen === "boolean" && k.wisselen !== wisselen){
    wisselen = k.wisselen;
    $("wissel").setAttribute("aria-pressed", wisselen);
    $("wissel").textContent = wisselen ? "Wisselen aan" : "Wisselen uit";
  }
  $("lijst").scrollTop = 0;
  teken();
}
// Onthoud de laatste keuzes op dit apparaat.
if (PERIODES.some(p => p.id === lees("periode"))) periode = lees("periode");
if (COMPETITIES.some(c => c.code === lees("competitie"))) actief = COMPETITIES.findIndex(c => c.code === lees("competitie"));
if (lees("competitie") === "alles") actief = ALLES;
if (lees("competitie") === "fav") actief = FAV;
$("zoek").oninput = () => teken();
if (actief < 0 && periode !== "vandaag") periode = "vandaag";
if (lees("wisselen") === "0") $("wissel").click();

$("versie").textContent = VERSIE;
const tik = () => $("klok").textContent = new Date().toLocaleTimeString("nl-NL", {hour:"2-digit", minute:"2-digit"});
tik(); setInterval(tik, 5000);
teken(); ververs();
setInterval(ververs, VERVERS_SEC * 1000);
setInterval(haalWeek, WEEK_MIN * 60000);
setInterval(volgende, WISSEL_SEC * 1000);
// Houd het scherm wakker zolang de pagina open staat (als de browser dat toestaat).
const wakker = () => navigator.wakeLock?.request("screen").catch(() => {});
wakker(); document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && wakker());
</script>
<script>
const CAST_APP_ID = "28EAC2B6";
const CAST_KANAAL = "urn:x-cast:nl.scorecasting.keuze";
if (/CrKey/.test(navigator.userAgent)) {
  // De pagina draait op een Cast-apparaat (zoals de Nest Hub): meld hem aan als cast-app en houd hem in beeld.
  document.getElementById("castknop").hidden = true;
  document.body.classList.add("hub"); teken();
  // Op de Hub kun je niet scrollen: blader zelf door lange lijsten.
  // Vloeiend: even stilstaan bovenaan, rustig naar beneden glijden, even stilstaan en terug naar boven.
  const SNELHEID = 70, WACHT_BOVEN = 4000, WACHT_ONDER = 3000;   // pixels per seconde, milliseconden
  let pos = 0, wachtTot = 0, vorigeTijd = 0, weergave = "";
  const glij = nu => {
    const m = document.getElementById("lijst"), max = m.scrollHeight - m.clientHeight;
    const w = actief + "|" + periode;
    if (w !== weergave){ weergave = w; pos = 0; wachtTot = nu + WACHT_BOVEN; }
    if (max <= 4){ pos = 0; }
    else if (nu >= wachtTot){
      pos += SNELHEID * Math.min(nu - vorigeTijd, 100) / 1000;
      if (pos >= max){
        if (pos < max + 1e6){ pos = max + 2e6; wachtTot = nu + WACHT_ONDER; }   // onderaan: even wachten
        else { pos = 0; wachtTot = nu + WACHT_BOVEN; }                          // daarna terug naar boven
      }
    }
    m.scrollTop = Math.min(pos, Math.max(max, 0));
    vorigeTijd = nu;
    requestAnimationFrame(glij);
  };
  requestAnimationFrame(glij);
  const sc = document.createElement("script");
  sc.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
  sc.onload = () => {
    const ctx = cast.framework.CastReceiverContext.getInstance();
    ctx.addCustomMessageListener(CAST_KANAAL, e => neemKeuzeOver(typeof e.data === "string" ? JSON.parse(e.data) : e.data));
    ctx.start({disableIdleTimeout: true, customNamespaces: {[CAST_KANAAL]: cast.framework.system.MessageType.JSON}});
  };
  document.head.append(sc);
} else {
  // Op telefoon of laptop: het cast-icoon rechtsboven start het scorebord op de Hub.
  const castknop = document.getElementById("castknop");
  let castCtx = null;
  window.__onGCastApiAvailable = ok => {
    if (!ok) return;
    castCtx = cast.framework.CastContext.getInstance();
    castCtx.setOptions({receiverApplicationId: CAST_APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
    castCtx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, () => {
      castknop.classList.toggle("aan", !!castCtx.getCurrentSession());
      setTimeout(window.stuurKeuze, 1500);   // geef de Hub even tijd om de pagina te laden
    });
  };
  // Stuur de gekozen competitie, periode en wisselstand naar de Hub.
  window.stuurKeuze = () => {
    const sessie = castCtx && castCtx.getCurrentSession();
    if (!sessie) return;
    const bericht = {periode, wisselen, favs: [...favs]};
    if (actief !== ZOEK) bericht.competitie = SPECIAAL[actief] || COMPETITIES[actief].code;   // zoeken blijft op de telefoon
    sessie.sendMessage(CAST_KANAAL, bericht).catch(() => {});
  };
  castknop.onclick = () => {
    if (!castCtx) { toonFlits("Casten werkt alleen in Chrome (Android of laptop)."); return; }
    if (castCtx.getCurrentSession()) { castCtx.endCurrentSession(true); toonFlits("Casten gestopt."); return; }
    castCtx.requestSession().catch(e => {
      if (e !== "cancel") toonFlits("Casten is niet gelukt (" + e + "). Staat de Hub aan en zit je op dezelfde wifi?");
    });
  };
  const sc = document.createElement("script");
  sc.src = "https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1";
  document.head.append(sc);
}
</script>
