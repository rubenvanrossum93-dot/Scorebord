<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d1a16">
<link rel="manifest" href="manifest.json">
<title>Tussenstanden casten</title>
<style>
:root{color-scheme:dark;--veld:#0d1a16;--vlak:#16271f;--lijn:#274236;--tekst:#f1f5ee;--zacht:#9fb3a6;--live:#ffd23f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--veld);color:var(--tekst);font-family:"Arial Narrow",Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px 16px;text-align:center}
h1{margin:0;font-size:28px;text-transform:uppercase;letter-spacing:.04em}
p{margin:0;color:var(--zacht);font-size:17px;max-width:32ch;line-height:1.4}
button,a.knop{font:700 20px inherit;font-family:inherit;border-radius:10px;padding:16px 22px;width:min(100%,320px);cursor:pointer;text-decoration:none;display:block}
#cast{background:var(--live);color:var(--veld);border:0}
#cast:disabled{opacity:.5}
#stop,a.knop{background:none;color:var(--tekst);border:2px solid var(--lijn)}
button:focus-visible,a:focus-visible{outline:3px solid var(--live);outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<h1>Tussenstanden</h1>
<p id="uitleg">Zet het scorebord op je Hub. Je telefoon blijft daarna vrij.</p>
<button id="cast" disabled>Cast naar de Hub</button>
<button id="stop" hidden>Stoppen met casten</button>
<a class="knop" href="./">Scorebord hier bekijken</a>
<script>
const APP_ID = "28EAC2B6";
const uitleg = document.getElementById("uitleg"), knop = document.getElementById("cast"), stop = document.getElementById("stop");
let ctx;
window.__onGCastApiAvailable = ok => {
  if (!ok){ uitleg.textContent = "Casten werkt hier niet. Open deze pagina in Chrome op Android of op een laptop."; return; }
  ctx = cast.framework.CastContext.getInstance();
  ctx.setOptions({receiverApplicationId: APP_ID, autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED});
  knop.disabled = false;
  ctx.addEventListener(cast.framework.CastContextEventType.SESSION_STATE_CHANGED, toon);
  toon();
};
function toon(){
  const s = ctx.getCurrentSession();
  stop.hidden = !s;
  knop.textContent = s ? "Naar een andere Hub casten" : "Cast naar de Hub";
  if (s) uitleg.textContent = "Het scorebord staat op " + s.getCastDevice().friendlyName + ".";
}
knop.onclick = () => ctx.requestSession().catch(e => {
  if (e !== "cancel") uitleg.textContent = "Casten is niet gelukt (" + e + "). Staat de Hub aan en zit je telefoon op dezelfde wifi?";
});
stop.onclick = () => { ctx.endCurrentSession(true); uitleg.textContent = "Casten gestopt."; };
setTimeout(() => { if (!ctx && knop.disabled) uitleg.textContent = "Casten werkt hier niet. Open deze pagina in Chrome op Android of op een laptop."; }, 6000);
</script>
<script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</body>
</html>
